<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- En-tête de la page -->
    <header>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#register">Register</a></li>
        </ul>
      </nav>
    </header>

    <!-- Contenu principal unique de la page -->
    <main>
      <section>
        <h1>Join our Developer Community</h1>
        <p>
          Learn semantic HTML, modern CSS, and JavaScript with hands-on
          practice.
        </p>
      </section>

      <!-- Section Formulaire avec Accessibilité -->
      <section id="register">
        <h2>Create your free account</h2>

        <form action="#" method="POST">
          <!-- Groupe 1 : Nom complet -->
          <div class="form-group">
            <label for="fullname">Full Name:</label>
            <input
              type="text"
              id="fullname"
              name="fullname"
              required
              aria-required="true"
              placeholder="John Doe"
            />
          </div>

          <!-- Groupe 2 : Email -->
          <div class="form-group">
            <label for="user-email">Email Address:</label>
            <input
              type="email"
              id="user-email"
              name="user-email"
              required
              placeholder="john@example.com"
            />
          </div>

          <!-- Bouton de soumission -->
          <button type="submit">Sign Up</button>
        </form>
      </section>
    </main>

    <!-- Pied de page -->
    <footer>
      <p>&copy; 2026 My First Web Project. All rights reserved.</p>
    </footer>
  </body>
</html>
